# Dedicated podman storage for the Mastra Factory image build.
#
# Same rationale as thinkpad-build-storage.conf (which see): the shared root
# storage.conf pins driver = "overlay" on a btrfs graphroot, forcing the
# userspace FUSE fallback — 8-minute one-line RUN steps, zero cache hits.
# The native btrfs driver makes layer commits sub-second subvolume
# snapshots.
#
# Used ONLY via CONTAINERS_STORAGE_CONF by mastra-image-build.service; the
# default root store (what the mastra quadlet runs from) is untouched — the
# builder `podman save | podman load`s the finished image across.
[storage]
driver = "btrfs"
graphroot = "/var/lib/containers-build/storage"
runroot = "/run/containers-build/storage"
