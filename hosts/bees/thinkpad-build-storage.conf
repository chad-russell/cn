# Dedicated podman storage for the thinkpad host-image build.
#
# WHY THIS EXISTS: the shared root storage.conf pins `driver = "overlay"`
# with a btrfs-backed graphroot, which forces containers-storage's userspace
# FUSE fallback (fuse-overlayfs). The build pays that cost on EVERY layer
# commit — verified live: one-line RUN steps (version stamp, bootc lint)
# took 8 minutes each, and every nightly was a full rebuild with zero
# layer-cache hits (21–25 min/day for an unchanged Containerfile).
#
# THE FIX: a separate graphroot using the NATIVE btrfs driver. Layer commits
# become subvolume snapshots (sub-second), no FUSE daemon, and the build
# never touches the production store that zot/caddy/quadlets depend on.
#
# Used ONLY via CONTAINERS_STORAGE_CONF=/etc/thinkpad-build-storage.conf by
# thinkpad-image-build.service. The default root store is untouched.
[storage]
driver = "btrfs"
graphroot = "/var/lib/containers-build/storage"
runroot = "/run/containers-build/storage"
