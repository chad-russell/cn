<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>QRCode.Bible Migration QA</title>
  <style>
    :root{--ink:#10231b;--paper:#f5f1e8;--panel:#fffdf7;--line:#ccd2ca;--muted:#6d746f;--approve:#2f8f62;--reject:#d45252;--focus:#276fbf;--old:#946b2d;--shadow:0 14px 40px #10231b18}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.topbar{min-height:64px;display:flex;align-items:center;gap:20px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}.brand{font-weight:850;font-size:17px;letter-spacing:-.02em;white-space:nowrap}.brand span{color:var(--muted);font-weight:600}.progress{height:8px;background:#dfe3dc;flex:1;max-width:420px;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--approve);width:0;transition:width .2s}.stats{display:flex;gap:14px;font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace}.stats b{font-size:15px}.view-tabs{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:9px;padding:3px}.view-tabs button{border:0;background:transparent;padding:7px 10px;border-radius:6px;color:var(--muted);cursor:pointer}.view-tabs button.active{background:var(--ink);color:white}.shell{max-width:1800px;margin:auto;padding:14px}.page-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:10px}.page-title{text-align:center}.page-title h1{font-size:20px;margin:0;letter-spacing:-.02em}.page-title code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.nav{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 12px;cursor:pointer}.nav:last-child{justify-self:end}.frames{display:grid;grid-template-columns:1fr 1fr;gap:12px}.browser{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}.browser.old{border-top:4px solid var(--old)}.browser.new{border-top:4px solid var(--focus)}.browser-bar{height:45px;padding:7px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.stamp{font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.old .stamp{color:var(--old)}.new .stamp{color:var(--focus)}.url{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);background:#eef0ea;border-radius:5px;padding:6px 8px;flex:1;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.browser iframe{width:100%;height:calc(100vh - 250px);min-height:430px;border:0;background:white}.decision{display:flex;justify-content:center;align-items:center;gap:16px;padding:16px}.decision button{min-width:160px;border:0;color:white;border-radius:999px;padding:13px 20px;font-weight:800;cursor:pointer;box-shadow:0 7px 18px #10231b28;transition:transform .12s}.decision button:hover{transform:translateY(-2px)}.decision .reject{background:var(--reject)}.decision .approve{background:var(--approve)}.decision small{color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.empty{text-align:center;padding:14vh 20px}.empty h2{font-size:28px}.queue{max-width:1000px;margin:24px auto;background:var(--panel);border:1px solid var(--line)}.queue-head,.queue-row{display:grid;grid-template-columns:1fr 100px 100px 130px;gap:12px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line)}.queue-head{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.queue-row strong{display:block}.queue-row code{font-size:11px;color:var(--muted)}.queue-row button{border:1px solid var(--line);background:white;border-radius:7px;padding:7px;cursor:pointer}.pill{font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace}.pill.bad{color:var(--reject)}.pill.good{color:var(--approve)}.loading{display:grid;place-items:center;height:70vh;color:var(--muted)}[hidden]{display:none!important}@media(max-width:800px){.topbar{flex-wrap:wrap;gap:9px}.progress{order:3;flex-basis:100%}.stats{margin-left:auto}.view-tabs{margin-left:0}.shell{padding:8px}.page-head{grid-template-columns:auto 1fr auto}.page-title h1{font-size:16px}.frames{grid-template-columns:1fr}.browser iframe{height:60vh;min-height:360px}.decision{position:sticky;bottom:0;background:color-mix(in srgb,var(--paper) 94%,transparent);z-index:5;padding:12px 4px}.decision button{min-width:0;flex:1}.decision small{display:none}.queue-head,.queue-row{grid-template-columns:1fr 55px 55px 72px;padding:10px 8px;gap:5px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Migration Match <span>QRCode.Bible</span></div>
    <div class="progress" aria-label="Your review progress"><i id="progressBar"></i></div>
    <div class="stats"><span><b id="doneCount">0</b> done</span><span><b id="leftCount">—</b> left</span></div>
    <nav class="view-tabs" aria-label="Views"><button id="deckTab" class="active">Compare</button><button id="allTab">All pages</button><button id="queueTab">Reject queue</button></nav>
  </header>
  <main>
    <div id="loading" class="loading">Building your review deck…</div>
    <section id="deck" class="shell" hidden>
      <div class="page-head">
        <button id="previous" class="nav" aria-label="Previous page">← Previous</button>
        <div class="page-title"><h1 id="pageTitle"></h1><code id="pageSlug"></code></div>
        <button id="skip" class="nav">Skip →</button>
      </div>
      <div class="frames">
        <article class="browser old"><div class="browser-bar"><span class="stamp">BEFORE</span><span class="url" id="oldUrl"></span><a id="oldOpen" target="_blank" rel="noopener" aria-label="Open old page in a new tab">↗</a></div><iframe id="oldFrame" title="Before: live WordPress page"></iframe></article>
        <article class="browser new"><div class="browser-bar"><span class="stamp">AFTER</span><span class="url" id="newUrl"></span><a id="newOpen" target="_blank" rel="noopener" aria-label="Open new page in a new tab">↗</a></div><iframe id="newFrame" title="After: replacement site page"></iframe></article>
      </div>
      <div class="decision">
        <button id="reject" class="reject">← Needs work</button><small>swipe / arrow keys</small><button id="approve" class="approve">Looks the same →</button>
      </div>
    </section>
    <section id="finished" class="empty" hidden><h2>Deck cleared ✓</h2><p>You reviewed every landing page on this browser.</p><button id="reviewAgain" class="nav">Review them again</button></section>
    <section id="allPages" class="queue" hidden><div class="queue-head"><span>All landing pages</span><span>Rejects</span><span>Approvals</span><span></span></div><div id="allRows"></div></section>
    <section id="queue" class="queue" hidden><div class="queue-head"><span>Rejected pages</span><span>Rejects</span><span>Approvals</span><span></span></div><div id="queueRows"></div></section>
  </main>
  <script>
    const reviewerId=localStorage.qrQaReviewer||(localStorage.qrQaReviewer=(crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`));let pages=[],deck=[],history=[],index=0,touchStart=null;const $=id=>document.getElementById(id);
    async function load(){const response=await fetch(`/api/pages?reviewer=${encodeURIComponent(reviewerId)}`);const data=await response.json();pages=data.pages;buildDeck();$('loading').hidden=true;$('deck').hidden=false;render();renderLists()}
    function buildDeck(includeReviewed=false){deck=includeReviewed?[...pages]:pages.filter(p=>!p.vote);index=0;history=[];updateStats()}
    function updateStats(){const done=pages.filter(p=>p.vote).length;$('doneCount').textContent=done;$('leftCount').textContent=pages.length-done;$('progressBar').style.width=`${pages.length?done/pages.length*100:0}%`}
    function render(){const p=deck[index];if(!p){$('deck').hidden=true;$('finished').hidden=false;return}$('finished').hidden=true;$('deck').hidden=false;$('pageTitle').textContent=p.title;$('pageSlug').textContent=`/${p.slug}`;for(const side of ['old','new']){$(`${side}Url`).textContent=p[`${side}Url`];$(`${side}Open`).href=p[`${side}Url`];$(`${side}Frame`).src=p[`${side}Url`]}$('previous').disabled=history.length===0}
    async function vote(verdict){const p=deck[index];if(!p)return;swipeEffect(verdict);const response=await fetch('/api/votes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reviewerId,slug:p.slug,verdict})});if(!response.ok)return;const counts=await response.json();p.vote=verdict;p.approvals=counts.approvals;p.rejections=counts.rejections;const canonical=pages.find(x=>x.slug===p.slug);Object.assign(canonical,p);history.push(p.slug);deck.splice(index,1);if(index>=deck.length)index=0;updateStats();render();renderLists()}
    function swipeEffect(verdict){const frames=document.querySelector('.frames');frames.animate([{transform:'translateX(0)',opacity:1},{transform:`translateX(${verdict==='approve'?40:-40}px)`,opacity:.15}],{duration:150,easing:'ease-out'})}
    function skip(delta=1){if(!deck.length)return;index=(index+delta+deck.length)%deck.length;render()}
    function previous(){const slug=history.pop();if(!slug)return;const p=pages.find(x=>x.slug===slug);deck.splice(index,0,p);render()}
    function pageRows(items,empty){return items.length?items.map(p=>`<div class="queue-row"><span><strong>${escapeHtml(p.title)}</strong><code>/${escapeHtml(p.slug)}</code></span><span class="pill bad">${p.rejections}</span><span class="pill good">${p.approvals}</span><button data-slug="${escapeHtml(p.slug)}">Compare</button></div>`).join(''):`<div class="empty"><h2>${empty}</h2><p>Pages that need another look will collect here.</p></div>`}
    function renderLists(){const rejected=pages.filter(p=>p.rejections>0).sort((a,b)=>b.rejections-a.rejections||a.title.localeCompare(b.title));$('queueRows').innerHTML=pageRows(rejected,'No rejects yet');$('allRows').innerHTML=pageRows(pages,'No pages found');document.querySelectorAll('[data-slug]').forEach(b=>b.onclick=()=>openPage(b.dataset.slug))}
    function openPage(slug){const p=pages.find(x=>x.slug===slug);deck=[p];index=0;showView('deck');render()}
    function showView(view){$('deckTab').classList.toggle('active',view==='deck');$('allTab').classList.toggle('active',view==='all');$('queueTab').classList.toggle('active',view==='queue');$('allPages').hidden=view!=='all';$('queue').hidden=view!=='queue';if(view==='deck')render();else{$('deck').hidden=true;$('finished').hidden=true}}
    function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    $('approve').onclick=()=>vote('approve');$('reject').onclick=()=>vote('reject');$('skip').onclick=()=>skip();$('previous').onclick=previous;$('deckTab').onclick=()=>{buildDeck();showView('deck')};$('allTab').onclick=()=>showView('all');$('queueTab').onclick=()=>showView('queue');$('reviewAgain').onclick=()=>{buildDeck(true);showView('deck')};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')vote('approve');if(e.key==='ArrowLeft')vote('reject');if(e.key==='ArrowDown')skip()});document.addEventListener('touchstart',e=>touchStart=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if(touchStart===null)return;const dx=e.changedTouches[0].clientX-touchStart;touchStart=null;if(Math.abs(dx)>80)vote(dx>0?'approve':'reject')},{passive:true});load().catch(e=>{$('loading').textContent=`Could not load the QA deck: ${e.message}`});
  </script>
</body>
</html>
