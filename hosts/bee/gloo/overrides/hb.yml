# Port publishing + rootless podman UID fix for the hummingbird/storyhub devcontainer.
#
# The dev service runs turbo which may start:
#   api       (tsx watch server)  → port 8000
#   web       (vite)              → port 3000
#   storyhub  (next dev -p 3001)  → port 3001
#
# storyhub_worker is a separate compose service, already publishes 8001.
# db_hb publishes 5567, db_storyhub publishes 54322.
services:
  dev:
    ports:
      - "8000:8000"
      - "3000:3000"
      - "3001:3001"
    userns_mode: "keep-id"
