# Publish Polymer ports to host + fix rootless podman UID mapping.
#
# turbo run dev starts:
#   polymer  (next dev --turbo)          → port 3000
#   admin360 (next dev --turbo -p 3001)  → port 3001
#
# Infra ports are already published in the repo's docker-compose.yml:
#   postgres :54324, minio :9004/:9005
services:
  app:
    ports:
      - "3000:3000"
      - "3001:3001"
    userns_mode: "keep-id"
