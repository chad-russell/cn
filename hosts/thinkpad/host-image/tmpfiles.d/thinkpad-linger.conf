# Enable user linger for crussell: bubblebox [[units]] (daily timers, checks)
# must run without a login session. logind treats an existing file under
# /var/lib/systemd/linger/<user> as enabled (loginctl enable-linger creates
# exactly this). Username baked in — same precedent as the sudoers grant
# (Containerfile 3.8): single-user personal image.
f /var/lib/systemd/linger/crussell - - - -
