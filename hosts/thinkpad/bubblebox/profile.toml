# Declarative bubblebox profile — self-contained (flake.nix analog).
# Realized by `bubblebox apply` into ~/.config/bubblebox/profile.lock (the
# pinned realization) + a content-addressed generation. See DESIGN-gc.md.
#
# The desired package set (floating; resolved from the registries, pinned in
# the lock between applies). Only ROOTS go here — compose deps (e.g. nvim's
# rg/fd) are pulled automatically via each entrypoint's compose list. Kept in
# sync with `bubblebox_tools` in hosts/thinkpad/Justfile.
#
# Forward-compatible with Phase 4 versioning ("nvim:stable"); for now each entry
# is a bare package name. (Top-level keys must precede the [[source]]/[[cache]]
# table headers — standard TOML.)
packages = [
  "aws", "bat", "dust", "eza", "fd", "gh", "htop",
  "noctalia", "nvim", "rg", "tokei", "vicinae",
  "ghostty", "wezterm", "yazi", "zoxide",
]

# Registries: when present, apply is PROFILE-AUTHORITATIVE — it resolves using
# ONLY these (no separate `source add`/`cache add` step needed). Empty → fall
# back to sources.toml/caches.toml. The `local` path is host-specific; a
# shippable profile uses `kind = "git"` + `url = "https://..."` against a
# package repo.
[[source]]
name = "personal"
kind = "local"
path = "~/Code/cn/hosts/thinkpad/bubblebox"
