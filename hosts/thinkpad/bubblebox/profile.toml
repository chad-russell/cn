# Declarative bubblebox profile — self-contained (flake.nix analog).
# Realized by `bubblebox apply` into ~/.config/bubblebox/profile.lock (the
# pinned realization) + a content-addressed generation. See DESIGN-gc.md.
#
# Each entry below is a ROOT — an entrypoint name exposed as a
# ~/.local/bin/<name> wrapper. The entrypoint's `package` field (default =
# the entrypoint's own name) names the underlying OCI image, so a root can
# share another package's image (e.g. age-keygen → age) without a duplicate
# build. Compose deps (e.g. nvim's rg/fd) are pulled automatically via each
# entrypoint's compose list and don't need to be listed here.
#
# This file is the single source of truth, applied IN PLACE:
# ~/.config/bubblebox/profile.toml symlinks here (cjust bubblebox-apply sets
# it up) and the engine mirrors profile.lock next to this file.
# Forward-compatible with Phase 4 versioning ("nvim:stable"); for now each entry is a bare package name. (Top-level keys
# must precede the [[source]]/[[cache]] table headers — standard TOML.)
packages = [
  "age", "age-keygen", "aws", "bat", "dust", "eza", "fastfetch", "fd", "gh", "htop",
  "nvim", "oh-my-posh", "pnpm", "psql", "rg", "rust-dev", "sops", "slack", "terraform",
  "tokei", "uv", "vicinae", "witr", "ghostty", "wezterm", "yazi", "zoxide",
]
# noctalia removed 2026-09-02 — replaced by the niri-caelestia-shell fork
# (built into the host image, Containerfile step 2.5; notifications, panels,
# lock, brightness/volume all come from the fork now).

# ── Flatpak apps ([flatpak], bubblebox ≥ 0.4.0) ──────────────────────────────
# Declarative flatpaks in the PER-USER installation (no root/polkit; app data
# in ~/.var/app is per-user either way, so moving from the old system
# installation keeps logins/settings). `apply` installs missing apps, heals
# manual uninstalls, and uninstalls only apps a previous generation declared.
# Anything else installed is reported as "unmanaged" and left alone
# (prune = false). Updates stay with flatpak (`flatpak update --user`).
#
# Adopted 2026-10-15 from think's system installation, with the 14
# Fedora-remote GNOME apps switched to the same ids from flathub (Fedora's OCI
# remote lives in the system installation only; they came from the
# installer's first boot, NOT the image, so a reinstall would otherwise lose
# them).
[flatpak]
remotes.flathub = "https://dl.flathub.org/repo/flathub.flatpakrepo"
apps = [
  # browsers + comms
  # (com.slack.Slack is the DESKTOP app; the bubblebox `slack` package above
  #  is the unrelated Slack developer CLI — not a duplicate.)
  "app.zen_browser.zen", "com.google.Chrome", "com.slack.Slack", "dev.vencord.Vesktop",
  "us.zoom.Zoom",
  "org.localsend.localsend_app",
  # security / vpn
  "com.onepassword.OnePassword", "me.proton.Pass", "com.protonvpn.www",
  # dev + making
  "dev.zed.Zed", "com.bambulab.BambuStudio", "org.inkscape.Inkscape",
  "org.onlyoffice.desktopeditors", "com.usebottles.bottles", "org.gnome.Boxes",
  # system tools
  "com.github.tchx84.Flatseal", "io.github.kolunmi.Bazaar", "io.missioncenter.MissionCenter",
  "net.nokyan.Resources", "dev.edfloreshz.CosmicTweaks", "io.github.getnf.embellish",
  "page.tesk.Refine",
  # media
  "io.github.nokse22.high-tide", "org.gnome.Showtime", "studio.planetpeanut.Bobby",
  # GNOME core apps (were Fedora-remote system flatpaks)
  "org.gnome.Calculator", "org.gnome.Characters", "org.gnome.Extensions", "org.gnome.Logs",
  "org.gnome.Loupe", "org.gnome.NautilusPreviewer", "org.gnome.Papers", "org.gnome.Snapshot",
  "org.gnome.TextEditor", "org.gnome.Weather", "org.gnome.baobab", "org.gnome.clocks",
  "org.gnome.font-viewer", "org.fedoraproject.MediaWriter",
]

# Registries: when present, apply is PROFILE-AUTHORITATIVE — it resolves using
# ONLY these (no separate `source add`/`cache add` step needed). Empty → fall
# back to sources.toml/caches.toml.
#
# 2026-10-06 — flipped to the published git source to dogfood the
# external-consumer flow: `apply` shallow-clones it under the bubblebox data
# dir on first use (channel.toml inside registers the bees cache as a
# substituent automatically). After new packages merge upstream, refresh with
# `bubblebox source update personal`; cache pulls need nothing (package
# indexes resolve from the [[cache]] below). ~/Code/bubblebox-pkgs stays as
# the contribution checkout (PRs; CI publishes).
[[source]]
name = "personal"
kind = "git"
url = "git+https://git.crussell.io/chad/bubblebox-pkgs.git"

# Binary cache: packages built + signed by bubblebox-pkgs CI (publish.yml),
# served by caddy on bees. With this declared, `apply --refresh` resolves
# against it AND devshell pull-on-entry can fetch off-host. Local descriptors win whenever the cache
# is unreachable or lacks a package (mixed local+cache setups keep working).
[[cache]]
name = "bees"
url = "https://bubblebox.internal.crussell.io"
# The profile's [[cache]] overrides the source's channel.toml, so the signing
# key must be repeated here or verification is silently off. With it, index +
# default-entrypoint signatures are MANDATORY (CI signs at publish; the key is
# the one in bubblebox-pkgs channel.toml / `bubblebox cache public-key`).
public_key = "10c3f915ab56866211b0f30be0fcf724962d75dbcbe00a2f2cc4541de07112f0"

# ── Host-resident files (Phase B) ────────────────────────────────────────────
# Source files live in `files/` next to this profile.toml, mirroring $HOME.
# `bubblebox apply` hashes each file's content into the content-addressed store
# and symlinks $HOME/<dst> → the store blob. Re-apply to change (declarative —
# no live-edit). `kind = "dir"` walks the tree into per-file store symlinks;
# user-owned files in managed dirs (e.g. opencode's auth.json) are never touched.
#
# Replaces the old Justfile `dotfiles` string + `cjust link`.
[[files]]
dst = ".zshrc"

[[files]]
dst = ".zshenv"

[[files]]
dst = ".aws/config"

[[files]]
dst = ".config/oh-my-posh.json"

[[files]]
dst = ".config/environment.d/10-bubblebox.conf"

# niri-caelestia-shell color-script venv pointer (see the file header for
# how the venv is built/maintained)
[[files]]
dst = ".config/environment.d/caelestia.conf"

# Declared dconf defaults: a keyfile compiled into a file-db layered UNDER the
# user-db via DCONF_PROFILE (Settings changes still win; `dconf reset` falls
# back to the declared value). See .config/dconf/bubblebox.d/00-thinkpad.
[[files]]
dst = ".config/environment.d/20-dconf.conf"

[[files]]
dst = ".config/dconf/bubblebox.profile"

[[files]]
dst = ".config/dconf/bubblebox.d"
kind = "dir"

[[files]]
dst = ".config/niri/config.kdl"

# Hyprland config (uwsm session; Ambxst shell, hymission overview). Same
# symlink-into-repo model as niri: LLM/local edits in ~/.config land in the
# repo checkout directly — commit from think is the only remaining step.
[[files]]
dst = ".config/hypr/hyprland.lua"
# ── more host-resident config (2026-10-15: previously hand-edited) ────────
[[files]]
dst = ".gitconfig"

[[files]]
dst = ".config/mimeapps.list"

# GNOME monitor layout (was hand-maintained; a Containerfile comment claimed
# it lived here long ago — now it actually does).
[[files]]
dst = ".config/monitors.xml"

# GTK icon theme for non-GNOME sessions (GNOME itself reads the dconf layer).
# NOTE: "Papirus" here vs dconf's Papirus-Dark — kept exactly as the machine
# had it; flip to Papirus-Dark here if you want them to match.
[[files]]
dst = ".config/gtk-3.0/settings.ini"

[[files]]
dst = ".config/gtk-4.0/settings.ini"

# caelestia shell preferences (bar/border/launcher). monitors/ under caelestia
# is per-output runtime state — deliberately NOT managed.
[[files]]
dst = ".config/caelestia/shell.json"

# Login autostart. Real files, not symlinks: the old zen symlink pointed at
# the SYSTEM flatpak export, gone since the per-user flatpak migration.
[[files]]
dst = ".config/autostart/app.zen_browser.zen.desktop"

[[files]]
dst = ".config/autostart/ghostty.desktop"

# User-scope flatpak overrides (host/etc access for theming).
[[files]]
dst = ".local/share/flatpak/overrides/global"


# Hyprland trial (2026-09-01 → 2026-09-02) retired: hyprland.lua and the
# session-bridge target removed with it. The niri session is now paired with
# our niri-caelestia-shell fork (built into the image, Containerfile 2.5).

[[files]]
dst = ".config/ghostty/config"

[[files]]
dst = ".config/vicinae/settings.json"

[[files]]
dst = ".config/wezterm/wezterm.lua"

[[files]]
dst = ".config/nvim"
kind = "dir"

[[files]]
dst = ".local/bin/zen-browser"

# Buzz Desktop (block/buzz) updater engine — the AppImage itself lives in
# ~/.local/share/buzz-desktop/, managed by this script, NOT here (binaries
# are not dotfiles). See the script header for the update story.
[[files]]
dst = ".local/bin/buzz-desktop"

# think host-image consumer: daily `bootc upgrade` stage + ntfy lag alert
# (the sudoers grant it relies on is baked into the image — Containerfile
# step 3.8). Full story in the script header.
[[files]]
dst = ".local/bin/thinkpad-image-update"

# Post-boot sanity gate — the boot-time counterpart of bees's build-time
# image gates. Silent when healthy; ntfy ping (with rollback hint) when the
# booted image is missing its load-bearing artifacts.
[[files]]
dst = ".local/bin/thinkpad-image-health"
# bubblebox drift + update check (read-only `plan --json`; ntfy on drift or
# new CI builds; never applies). Full story in the script header.
[[files]]
dst = ".local/bin/thinkpad-bubblebox-check"
# dconf declared-layer inspector: status (shadowed/overridden keys), adopt
# (reset shadow copies so declared defaults show through), accept <key>.
[[files]]
dst = ".local/bin/dconf-bubblebox"

[[files]]
dst = ".local/share/applications/buzz.desktop"

[[files]]
dst = ".local/share/applications/wezterm.desktop"

[[files]]
dst = ".local/share/applications/ghostty.desktop"

# ── Systemd user units (Phase C) ─────────────────────────────────────────────
# Source files live in `units/` next to this profile.toml. Replaces the old
# Justfile `user_units` string + `cjust units`. A declared name carrying its
# own suffix (e.g. "nightly.timer") is used verbatim; bare names get the
# implicit ".service".
# (The bubblebox-pkgs nightly CI moved to bee — NixOS, always-on; see
# hosts/bee. Don't run CI on the laptop.)
[[units]]
name = "vicinae"
enable = true

# Buzz Desktop AppImage updater — daily digest-verified update check
# (the app's own Tauri updater ships endpoint-less; see buzz-desktop).
[[units]]
name = "buzz-desktop-update.service"

[[units]]
name = "buzz-desktop-update.timer"
enable = true

# The niri-caelestia-shell fork, as a systemd user unit (replaces the old
# `spawn-at-startup "qs" ...` line in niri config.kdl): enabled via
# niri.service.wants so it only runs under niri, and Restart=on-failure
# turns a startup-race crash into a 1s blip. See the unit header.
[[units]]
name = "caelestia-shell"
enable = true

# think host-image pipeline consumer (see .local/bin/thinkpad-image-update):
# stages the latest bees build daily and pings ntfy when the booted image
# lags the registry by >7 days. Service declared for the timer's Unit=.
[[units]]
name = "thinkpad-image-update.service"

[[units]]
name = "thinkpad-image-update.timer"
enable = true

# Post-boot health gate (see .local/bin/thinkpad-image-health): runs once
# per boot, asserts the booted image's load-bearing artifacts, pings ntfy
# on failure. No auto-rollback by design — see the script header.
[[units]]
name = "thinkpad-image-health.service"
enable = true

# Daily bubblebox drift + update check (see .local/bin/thinkpad-bubblebox-check):
# the user-layer counterpart of thinkpad-image-update. Reports only.
[[units]]
name = "thinkpad-bubblebox-check.service"

[[units]]
name = "thinkpad-bubblebox-check.timer"
enable = true

# Compiles .config/dconf/bubblebox.d → ~/.local/state/dconf/bubblebox (the
# file-db in bubblebox.profile): at login, and on keyfile change via the path
# unit. `cjust bubblebox-apply` also triggers it directly.
[[units]]
name = "dconf-bubblebox-compile.service"
enable = true

[[units]]
name = "dconf-bubblebox-compile.path"
enable = true
