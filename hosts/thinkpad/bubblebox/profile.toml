# Declarative bubblebox profile — self-contained (flake.nix analog).
# Realized by `bubblebox apply` into ~/.config/bubblebox/profile.lock (the
# pinned realization) + a content-addressed generation. See DESIGN-gc.md.
#
# Each entry below is a ROOT — an entrypoint name exposed as a
# ~/.local/bin/<name> wrapper. The entrypoint's `package` field (default =
# the entrypoint's own name) names the underlying OCI image, so a root can
# share another package's image (e.g. age-keygen → age) without a duplicate
# build. Compose deps (e.g. nvim's rg/fd) are pulled automatically via each
# entrypoint's compose list and don't need to be listed here.
#
# This file is the single source of truth — hosts/thinkpad/Justfile reads it
# directly for bubblebox-build/export/status (no separate `bubblebox_tools`
# list to keep in sync). Forward-compatible with Phase 4 versioning
# ("nvim:stable"); for now each entry is a bare package name. (Top-level keys
# must precede the [[source]]/[[cache]] table headers — standard TOML.)
packages = [
  "age", "age-keygen", "aws", "bat", "dust", "eza", "fastfetch", "fd", "gh", "htop",
  "noctalia", "nvim", "oh-my-posh", "psql", "rg", "rust-dev", "sops", "slack", "terraform",
  "tokei", "vicinae", "witr", "ghostty", "wezterm", "yazi", "zoxide",
]

# Registries: when present, apply is PROFILE-AUTHORITATIVE — it resolves using
# ONLY these (no separate `source add`/`cache add` step needed). Empty → fall
# back to sources.toml/caches.toml. The `local` path points at the bubblebox-pkgs
# source repo (a separate git repo on disk, mirroring how a real external package
# source would be consumed); flip to `kind = "git"` + `url = "..."` to dogfood
# the published flow.
[[source]]
name = "personal"
kind = "local"
path = "~/Code/bubblebox-pkgs"

# Binary cache: thinkpad-built packages published to bees (`cjust
# bubblebox-publish`), served by caddy at the internal wildcard above. With
# this declared, `apply --refresh` resolves against it AND devshell
# pull-on-entry can fetch off-host. Local descriptors win whenever the cache
# is unreachable or lacks a package (mixed local+cache setups keep working).
[[cache]]
name = "bees"
url = "https://bubblebox.internal.crussell.io"

# ── Host-resident files (Phase B) ────────────────────────────────────────────
# Source files live in `files/` next to this profile.toml, mirroring $HOME.
# `bubblebox apply` hashes each file's content into the content-addressed store
# and symlinks $HOME/<dst> → the store blob. Re-apply to change (declarative —
# no live-edit). `kind = "dir"` walks the tree into per-file store symlinks;
# user-owned files in managed dirs (e.g. opencode's auth.json) are never touched.
#
# Replaces the old Justfile `dotfiles` string + `cjust link`.
[[files]]
dst = ".zshrc"

[[files]]
dst = ".zshenv"

[[files]]
dst = ".aws/config"

[[files]]
dst = ".config/oh-my-posh.json"

[[files]]
dst = ".config/environment.d/10-bubblebox.conf"

[[files]]
dst = ".config/niri/config.kdl"

# Hyprland config for the Caelestia-shell trial (2026-09-01). Lua format —
# hyprlang .conf is removed in Hyprland 0.57. See the file header for the
# session-target bridge and niri-parity notes. Drop this entry + the file if
# the trial is retired without graduating to the full caelestia dots.
[[files]]
dst = ".config/hypr/hyprland.lua"

# satty (screenshot editor) theme/config — see Mod+P bind in hyprland.lua
[[files]]
dst = ".config/satty/config.toml"

[[files]]
dst = ".config/ghostty/config"

[[files]]
dst = ".config/vicinae/settings.json"

[[files]]
dst = ".config/wezterm/wezterm.lua"

[[files]]
dst = ".config/nvim"
kind = "dir"

# opencode: manage the authored config + skills only. opencode ALSO treats
# this dir as an npm workspace (node_modules/, package.json, package-lock.json
# appear when it installs skills) — that tool-owned state is deliberately NOT
# managed here, same rule as nvim's plugin trees: authored config yes,
# package-manager state no.
[[files]]
dst = ".config/opencode"
kind = "dir"

[[files]]
dst = ".local/bin/zen-browser"

[[files]]
dst = ".local/bin/hermes-desktop"

[[files]]
dst = ".local/share/applications/wezterm.desktop"

[[files]]
dst = ".local/share/applications/ghostty.desktop"

[[files]]
dst = ".local/share/applications/hermes.desktop"

# ── Systemd user units (Phase C) ─────────────────────────────────────────────
# Source files live in `units/` next to this profile.toml. Replaces the old
# Justfile `user_units` string + `cjust units`. A declared name carrying its
# own suffix (e.g. "nightly.timer") is used verbatim; bare names get the
# implicit ".service".
# (The bubblebox-pkgs nightly CI moved to bee — NixOS, always-on; see
# hosts/bee. Don't run CI on the laptop.)
[[units]]
name = "opencode-web"
enable = true

[[units]]
name = "vicinae"
enable = true

# Bridge target started by Hyprland at session start (see hyprland.lua) —
# dependency-starts graphical-session.target, which Fedora's start-hyprland
# wrapper doesn't do (niri/GNOME do it themselves). enable stays false:
# systemd enable is wrong for a compositor-started target.
[[units]]
name = "hyprland-session.target"
