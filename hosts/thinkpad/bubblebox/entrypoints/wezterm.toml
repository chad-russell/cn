# Converted from ../wezterm/profile.
# wezterm is a GUI terminal, so it needs the host's display/runtime/GPU surface:
#   - writable /run/user/$UID (XDG_RUNTIME_DIR) for its IPC sockets
#   - GPU access (/dev/dri) for OpenGL rendering
#   - host fonts (the stock image fontconfig set is minimal). Relying on the
#     host's /usr/share/fonts is the less-hermetic, disk-saving choice; to make
#     wezterm fully hermetic, `dnf install` a font set in the Containerfile
#     (or compose a dedicated `fonts` package) and drop the bind below — the
#     content-addressed store de-dups identical font bytes either way.
# TMPDIR is redirected to /tmp because wezterm writes its "blob lease" under
# $TMPDIR (defaults to /var/tmp, read-only in the sandbox).
primary = "wezterm"

[sandbox]
writable_home = true
writable_run = true

[sandbox.env]
TMPDIR = "/tmp"

# Replacing /dev wholesale with the host's avoids EPERM on render nodes when
# combined with bwrap's fresh devtmpfs.
[[sandbox.bind]]
src = "/dev"
dst = "/dev"
mode = "dev-bind"

[[sandbox.bind_try]]
src = "/sys"
dst = "/sys"
mode = "ro"

[[sandbox.bind_try]]
src = "/usr/share/fonts"
dst = "/usr/share/fonts"
mode = "ro"
