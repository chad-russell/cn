# Converted from ../wezterm/profile.
# wezterm is a GUI terminal, so it needs the host's display/runtime/GPU surface:
#   - writable /run/user/$UID (XDG_RUNTIME_DIR) for its IPC sockets
#   - GPU access (/dev/dri) for OpenGL rendering
#   - host fonts (the stock image fontconfig set is minimal)
# TMPDIR is redirected to /tmp because wezterm writes its "blob lease" under
# $TMPDIR (defaults to /var/tmp, read-only in the sandbox).
primary = "wezterm"

[sandbox]
writable_home = true
writable_run = true

[sandbox.env]
TMPDIR = "/tmp"

# Replacing /dev wholesale with the host's avoids EPERM on render nodes when
# combined with bwrap's fresh devtmpfs.
[[sandbox.bind]]
src = "/dev"
dst = "/dev"
mode = "dev-bind"

[[sandbox.bind_try]]
src = "/sys"
dst = "/sys"
mode = "ro"

[[sandbox.bind_try]]
src = "/usr/share/fonts"
dst = "/usr/share/fonts"
mode = "ro"

[hook]
# Seed fontconfig's user cache on first run. The bind-mounted /usr/share/fonts
# has a different stat than the host's original, so fontconfig rejects the host
# system cache and needs its own user-level cache at ~/.cache/fontconfig.
pre_run = '''
if [ ! -d "$HOME/.cache/fontconfig" ] || [ -z "$(ls -A "$HOME/.cache/fontconfig" 2>/dev/null)" ]; then
  fc-cache -f >/dev/null 2>&1
fi
'''
