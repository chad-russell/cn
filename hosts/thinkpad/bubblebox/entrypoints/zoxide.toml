# Converted from ../zoxide/profile.
# zoxide keeps a frequency database of visited dirs. Persist it under the
# bubblebox data dir (NOT the host's ~/.local/share/zoxide) so the host stays
# clean and the db survives across runs. Same /persist pattern as nvim.
#
# NOTE: this wraps the binary, not a shell function, so the seamless `z foo`
# integration (`zoxide init bash`) doesn't apply directly — wrap from your
# shell if you want that:
#   z()  { cd "$($BUBBLEBOX run zoxide query -- "$@")" || return; }
#   za() { $BUBBLEBOX run zoxide add "$@"; }
primary = "zoxide"

[[sandbox.bind]]
src = "$BUBBLEBOX_DATA_DIR/zoxide"
dst = "/persist"
mode = "rw"

[sandbox.env]
_ZO_DATA_DIR = "/persist"

[hook]
pre_run = 'mkdir -p "$BUBBLEBOX_DATA_DIR/zoxide"'
