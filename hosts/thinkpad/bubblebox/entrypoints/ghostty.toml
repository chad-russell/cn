# ghostty is a GTK4/libadwaita GUI terminal, so it needs the host's
# display/runtime/GPU surface — same surface wezterm needs, plus the host icon
# theme (GTK4 apps render icons and consult the icon-theme setting):
#   - writable /run/user/$UID (XDG_RUNTIME_DIR) for Wayland + IPC sockets
#   - GPU access (/dev/dri) for the GTK GL renderer
#   - host fonts (the stock Fedora image fontconfig set is minimal)
#   - host icons (so libadwaita/gtk resolves the Papirus theme set by `cjust icons`)
# TMPDIR is redirected to /tmp because ghostty/fontconfig may write scratch
# files under $TMPDIR (defaults to /var/tmp, read-only in the sandbox).
primary = "ghostty"

[sandbox]
writable_home = true
writable_run = true

[sandbox.env]
TMPDIR = "/tmp"

# ghostty locates its resources (themes/, shell-integration/) by deriving a path
# from /proc/self/exe. Inside the bubblebox sandbox (bwrap + FUSE/composefs
# rootfs) that derivation fails, so `+list-themes` exits 1 and `theme =` in the
# config silently fails to load (falling back to default colors). Pointing it at
# the image's data dir explicitly restores theme loading + shell integration.
GHOSTTY_RESOURCES_DIR = "/usr/share/ghostty"

# Replacing /dev wholesale with the host's avoids EPERM on render nodes when
# combined with bwrap's fresh devtmpfs (same reason wezterm does this rather
# than --dev /dev + a later /dev/dri bind).
[[sandbox.bind]]
src = "/dev"
dst = "/dev"
mode = "dev-bind"

[[sandbox.bind_try]]
src = "/sys"
dst = "/sys"
mode = "ro"

[[sandbox.bind_try]]
src = "/usr/share/fonts"
dst = "/usr/share/fonts"
mode = "ro"

[[sandbox.bind_try]]
src = "/usr/share/icons"
dst = "/usr/share/icons"
mode = "ro"
