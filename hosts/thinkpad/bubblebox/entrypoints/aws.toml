# Converted from ../aws/profile.
# aws with a VENDORED, non-secret config (profiles/regions/SSO roles baked into
# the image at /usr/share/bubblebox/aws/config). Credentials (~/.aws/credentials,
# ~/.aws/sso/cache) stay at their default host location — runtime, machine-local,
# short-lived. /home writable so aws can read & write ~/.aws creds/tokens.
primary = "aws"

[sandbox]
writable_home = true

[sandbox.env]
AWS_CONFIG_FILE = "/usr/share/bubblebox/aws/config"
