# Hyprland config — Caelestia trial (2026-09-01)
#
# Deliberately minimal: this exists to boot Hyprland with the Caelestia
# shell running, nothing more. The full Caelestia "dots" experience (their
# managed Hyprland config with Lua user-overrides) is the alternative — if
# this trial graduates, consider `caelestia install` into ~/.config/hypr
# instead of growing this file.
#
# Caelestia shell is image-installed (gmanka/caelestia COPR); it reads
# ~/.config/caelestia/shell.json for its own settings.
#
# Removed-by-design: Caelestia's own keybind to kill/restart the shell uses
# Hyprland IPC and works out of the box; SUPER+Q/ENTER basics below are just
# enough to escape if the shell never comes up.

monitor = , preferred, auto, 1

env = XCURSOR_THEME, Bibata-Modern-Ice
env = XCURSOR_SIZE, 24

exec-once = caelestia-shell

# --- minimal escape hatch binds (Caelestia provides the full set) ---------
bind = SUPER, Return, exec, ghostty
bind = SUPER, Q, killactive
bind = SUPER, M, exit

# Idle/lock left to Caelestia (it ships hyprlock/hypridle integration when
# installed). Add here only if the trial keeps them off.
