# Hyprland config — Caelestia trial (2026-09-01)
#
# Deliberately minimal: boot Hyprland with the Caelestia shell running and
# Vicinae bound to the same Super+Space muscle memory as niri. The full
# Caelestia "dots" experience (their managed Lua config) is the alternative
# — if this trial graduates, `caelestia install` writes their tree instead.
#
# The Caelestia shell ships as QML under /etc/xdg/quickshell/caelestia
# (image RPM from gmanka/caelestia COPR) — there is no standalone
# caelestia-shell binary; quickshell hosts it.

monitor = , preferred, auto, 1

env = XCURSOR_THEME, Bibata-Modern-Ice
env = XCURSOR_SIZE, 24

exec-once = quickshell -c caelestia

# Vicinae launcher daemon already runs as a systemd user unit (started by
# graphical-session.target under any compositor) — only the trigger is needed.
bind = SUPER, Space, exec, vicinae toggle

# --- minimal escape-hatch binds (Caelestia defines the full set) ----------
bind = SUPER, Return, exec, ghostty
bind = SUPER, Q, killactive
bind = SUPER, M, exit

# Idle/lock left to Caelestia (it ships hyprlock/hypridle integration when
# installed). Add here only if the trial keeps them off.
