# satty — post-screenshot editor (grim | satty pipeline, Mod+P).
# Everforest-medium tones to match the shell scheme; auto-copies to
# clipboard on every edit finish; saves default to niri's screenshot path.
[general]
 screenshots = "~/Pictures/Screenshots"
 screenshots-dir = "~/Pictures/Screenshots"
 early-exit = true
 copy-command = "wl-copy"
 default-tool = "pointer"
 output-filename = "~/Pictures/Screenshots/%Y-%m-%d %H-%M-%S.png"

[font]
 family = "Cascadia Code Nerd Font"

# Everforest medium dark palette
[color-pen]
 red = "#e67e80"
 green = "#a7c080"
 blue = "#7fbbb3"
 yellow = "#dbbc7f"
 purple = "#d699b6"

[annotations]
 fill = false

[color]
 primary = "#7fbbb3"
 secondary = "#2d353b"
 background = "#2d353b"
 text = "#d3c6aa"
