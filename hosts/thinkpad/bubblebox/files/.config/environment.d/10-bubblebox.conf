# Graphical-session PATH.
#
# Niri's `spawn` does PATH lookup but does NOT source .zshenv (which only
# covers zsh shells). Since vicinae and noctalia are bubblebox wrappers at
# ~/.local/bin/<tool>, that dir must reach the GDM-launched Wayland session
# — that's what environment.d does: systemd-environment-d-generator merges
# this into the user session environment that niri inherits.
#
# opencode also runs on the host (installed via `cjust opencode-install` to
# ~/.local/bin/opencode), so ~/.local/bin covers it too.
#
# Literal PATH on purpose — environment.d has no $VAR expansion we can rely
# on. The standard system dirs are kept so host binaries (ptyxis, nautilus,
# flatpak, xwayland-satellite) still resolve. .zshenv keeps its own (deduped)
# copy for SSH/non-session shells; the two don't conflict.
PATH=/var/home/crussell/.local/bin:/var/home/crussell/.cargo/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin:/var/lib/flatpak/exports/bin:/var/home/crussell/.local/share/flatpak/exports/bin
