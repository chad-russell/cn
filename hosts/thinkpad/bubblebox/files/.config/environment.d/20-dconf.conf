# dconf profile with a declared-defaults layer (bubblebox [[files]]):
#   user-db:user                      ← your changes (Settings, gsettings) — wins
#   file-db:~/.local/state/dconf/...  ← compiled from ~/.config/dconf/bubblebox.d
#   system-db:local/site/distro       ← Fedora's stock profile, unchanged
# environment.d feeds the systemd user manager, so D-Bus-activated readers
# (gsd-*, portals, dconf-service) get it too, not just login shells.
# Absolute path: environment.d has no reliable $HOME expansion.
DCONF_PROFILE=/var/home/crussell/.config/dconf/bubblebox.profile
