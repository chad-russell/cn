# Points the niri-caelestia-shell color scripts at their Python venv
# (see scripts/colors/_env.sh in chad-russell/niri-caelestia-shell).
# The venv itself is user state, created with:
#   uv venv --prompt caelestia ~/.local/state/quickshell/.venv -p 3.12
#   uv pip install -p ~/.local/state/quickshell/.venv/bin/python \
#     "materialyoucolor==2.0.10" pillow opencv-contrib-python numpy psutil \
#     loguru click tqdm requests beautifulsoup4 lxml curl_cffi
# (trimmed from scripts/setup/requirements.txt — the pygobject/pycairo/
# dbus-python entries there are for the optional KDE wrapper and need
# system headers to build; this venv covers generate_colors_material.py.)
#
# CRITICAL PIN: materialyoucolor MUST be 2.0.10 (upstream's pin). 3.x
# renames the palette key keys (primary_paletteKeyColor →
# primaryPaletteKeyColor) and generate_colors_material.py dies with
# KeyError: 'primary_paletteKeyColor' → "Color generation failed" in the
# shell's wallpaper/color pipeline.
CAELESTIA_VIRTUAL_ENV=/var/home/crussell/.local/state/quickshell/.venv
