# MangoWM config for `think` — the ambxst-shell + trial-model setup.
#
# Source of truth: hosts/thinkpad/bubblebox/files/.config/mango/config.conf
# (deployed as a symlink by `cjust bubblebox-apply`). Hot-reloads on save.
# Base = the stock /etc/mango/config.conf shipped by the image (mangowm from
# Terra; verified against mangowm.github.io docs, 2026-11); this copy keeps
# every stock key and adjusts only what's called out below. Layers:
#   * Ambxst — the same Wayland shell as niri/Hyprland: ambxst's axctl
#     regenerates ~/.local/share/ambxst/mango.conf (startup line + binds);
#     `source`d at the TOP so later lines here win over generated binds.
#   * vicinae — launcher daemon runs via vicinae.service (graphical-session
#     target; any compositor). Mod+Space toggles it (niri/Hyprland parity).
#   * trial model — tag 3 = scroller (niri/PaperWM tape), tag 4 = monocle;
#     everything else floats.
# Validate: `mango -p -c ~/.config/mango/config.conf`

# ── Ambxst (desktop shell) ─────────────────────────────────────────────────
# ambxst rewrites this file on startup (exec-once + generated keybinds
# table). Sourcing it gives us the shell + its binds; our overrides below
# then win (mango: later duplicate bind= lines replace earlier ones).
source = ~/.local/share/ambxst/mango.conf

# ── input ──────────────────────────────────────────────────────────────────
# Caps=Ctrl/Esc swap like niri + Hyprland (same caps:swapescape option);
# natural scrolling like GNOME/niri.
xkb_rules_options = caps:swapescape
trackpad_natural_scrolling = 1

# ── tag layout model (the trial's point) ───────────────────────────────────
# Everything floats unless a tag rule assigns a layout (the generated binds
# don't float anything; tags default to tile — so float explicitly instead).
tag_rule=id:*,open_as_floating:1
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:monocle

# ── launcher: Mod+Space → vicinae (niri/Hyprland parity) ───────────────────
# axctl generated SUPER,SPACE → togglefloating (Custom Bind 20); this later
# line wins (mango: last bind wins). ghostty = bubblebox wrapper; explicit
# $HOME path because the session PATH may lack ~/.local/bin.
bind=SUPER,SPACE,spawn,$HOME/.local/bin/vicinae toggle
# keep floating-toggle available on the muscle-adjacent Super+Alt+Space
bind=SUPER+ALT,SPACE,togglefloating

# ── terminal + session plumbing ────────────────────────────────────────────
bind=SUPER,Return,spawn,$HOME/.local/bin/ghostty
bind=SUPER,T,spawn,$HOME/.local/bin/ghostty
# GDM launches mango directly (no uwsm here): import the Wayland env into
# the systemd user manager ourselves — vicinae.service, ambxst (systemd-run
# --user) and GUI spawns all need WAYLAND_DISPLAY in the user manager.
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
