# Per-desktop-name portal config (portals.conf(5)) — applies only in the
# ShojiWM session (XDG_CURRENT_DESKTOP contains "ShojiWM"). Per the spec the
# first matching file WINS and nothing merges: this file fully REPLACES the
# generic ../portals.conf in this session, so the FileChooser=gnome pin from
# there is repeated below (without it the ShojiWM session would fall back to
# xdg-desktop-portal-gtk's dated GTK3 picker). ScreenCast goes to the
# compositor's own backend (mirrors ShojiWM's installer default); everything
# else falls back to gtk.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=gnome
org.freedesktop.impl.portal.ScreenCast=shojiwm
