# Which portal backend serves which interface (portals.conf(5)).
#
# WHY: the file picker apps open is the FileChooser portal interface, and
# the compositor backends we run don't implement it (the shojiwm portal
# covers ScreenCast only, and only in the ShojiWM session -- see
# shojiwm-portals.conf next to this file; niri has no backend at all). The
# generic fallback would be xdg-desktop-portal-gtk's GTK3 dialog
# — dated-looking, ignores the modern GTK file-chooser settings.
# xdg-desktop-portal-gnome is already baked into the image and serves the
# Adwaita GTK4 dialog — the same one Nautilus/GNOME apps use, honoring the
# dark theme and the [org/gtk/gtk4/settings/file-chooser] keys in
# dconf/bubblebox.d.
#
# Interface-only pin: FileChooser goes to gnome, everything else keeps the
# session default (shojiwm screencast + gtk fallback in the ShojiWM session;
# plain gtk under niri). gtk stays installed on purpose — it's the fallback
# for Settings/Notification/AppChooser/Print. User config here overrides
# /usr/share/xdg-desktop-portal/portals.conf for both sessions. In the
# ShojiWM session the per-desktop-name shojiwm-portals.conf REPLACES this
# file entirely (first match wins, no merging) — it repeats the FileChooser
# pin and adds the compositor's ScreenCast backend.
[preferred]
org.freedesktop.impl.portal.FileChooser=gnome
