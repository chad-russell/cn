# Which portal backend serves which interface (portals.conf(5)).
#
# WHY: the file picker apps open is the FileChooser portal interface, and the
# hyprland backend implements none (its wiki: keep xdg-desktop-portal-gtk
# alongside XDPH for that). The generic fallback is xdg-desktop-portal-gtk's
# GTK3 dialog — dated-looking, ignores the modern GTK file-chooser settings.
# xdg-desktop-portal-gnome is already baked into the image (Containerfile
# step with the compositor stack) and serves the Adwaita GTK4 dialog —
# the same one Nautilus/GNOME apps use, honoring the dark theme and the
# [org/gtk/gtk4/settings/file-chooser] keys in dconf/bubblebox.d.
#
# Interface-only pin: FileChooser goes to gnome, everything else keeps the
# session default (hyprland screencast + gtk fallback). gtk stays installed
# on purpose — it's the fallback for Settings/Notification/AppChooser/Print.
# User config here overrides /usr/share/xdg-desktop-portal/portals.conf
# (and the per-DE hyprland-portals.conf) for both Hyprland and niri sessions.
[preferred]
org.freedesktop.impl.portal.FileChooser=gnome
