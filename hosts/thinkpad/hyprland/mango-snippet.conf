# mango trial additions — APPEND to a copy of the stock config:
#   mkdir -p ~/.config/mango
#   cp /etc/mango/config.conf ~/.config/mango/config.conf
#   cat hosts/thinkpad/hyprland/mango-snippet.conf >> ~/.config/mango/config.conf
#   mango -c ~/.config/mango/config.conf -p        # validate without starting
#
# Config hot-reloads on save (like Hyprland). The stock config's Alt-based
# binds stay active alongside these — this snippet only ADDS. Keys verified
# against mangowm.github.io docs (2026-11, mangowm 0.18 in Terra).

var=term,$HOME/.local/bin/ghostty

# ── the trial model: float everywhere; tags 3/4 get real layouts ───────────
tag_rule=id:*,open_as_floating:1
tag_rule=id:3,layout_name:scroller,no_hide:1
tag_rule=id:4,layout_name:monocle,no_hide:1

# Cycle layouts on the focused tag (scroller → monocle → tile), or bind
# direct jumps:
circle_layout=scroller,monocle,tile
bind=SUPER,N,switch_layout
# bind=SUPER,s,setlayout,scroller
# bind=SUPER,t,setlayout,tile

# ── overview (built in, Hycov-style: every tag's windows, live) ────────────
bind=SUPER,TAB,toggleoverview
# Hot-corner alternative: enable_hotarea=1 + hotarea_corner=3 (bottom-right).
# Overview restricted to the CURRENT tag's windows: toggleoverview,1
# While open: left-click focuses, right-click closes, jump labels via keys.

# ── terminal + bar ─────────────────────────────────────────────────────────
# ghostty is the bubblebox wrapper at ~/.local/bin/ghostty — explicit $HOME
# path because GDM's session env may lack ~/.local/bin on PATH ($HOME passes
# through to the spawn shell verbatim per mango's var rules).
bind=SUPER,Return,spawn,$term
bind=SUPER,T,spawn,$term
exec_once=waybar
# Import the Wayland env into the systemd user manager — bubblebox wrappers
# spawn GUI apps via systemd-run --user, and nothing else imports it in a
# plain GDM-launched session.
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# waybar's stock bar works; mango exposes tag/window state to it over IPC
# (mmsg — see https://mangowm.github.io/docs/ipc). DreamMaoMao/mango-config
# has a tuned waybar config if the stock one is too plain.
