# Graphical-session PATH.
#
# Niri's `spawn` does PATH lookup but does NOT source .zshenv (which only
# covers zsh shells). Since vicinae and noctalia are now bubblebox wrappers
# at ~/.local/bin/<tool>, that dir must reach the GDM-launched Wayland
# session — that's what environment.d does: systemd-environment-d-generator
# merges this into the user session environment that niri inherits.
#
# Ordering: ~/.local/bin (bubblebox wrappers) BEFORE the shellbox exports dir,
# so for tools that exist in both (nvim, aws, wezterm, noctalia, vicinae, …)
# the bubblebox version wins. The shellbox entry is kept below during the
# migration transition because opencode hasn't moved to the host yet (waiting
# on host-image rebuild for nodejs/npm). Remove that segment in Phase B,
# after `cjust opencode-install` has run successfully.
#
# Literal PATH on purpose — environment.d has no $VAR expansion we can rely
# on. The standard system dirs are kept so host binaries (ptyxis, nautilus,
# flatpak, xwayland-satellite) still resolve. .zshenv keeps its own (deduped)
# copy for SSH/non-session shells; the two don't conflict.
PATH=/var/home/crussell/.local/bin:/var/home/crussell/.local/share/shellbox/exports/bin:/var/home/crussell/.cargo/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin:/var/lib/flatpak/exports/bin:/var/home/crussell/.local/share/flatpak/exports/bin
