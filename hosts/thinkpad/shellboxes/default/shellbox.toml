name = "default"
image = "localhost/shellbox-default:latest"

[shell]
tools = ["htop", "rg", "fd", "bat", "eza", "zoxide", "wezterm", "tokei"]

[shell.env]
# wezterm config is vendored in this box (config/wezterm.lua); point wezterm at
# it directly so we don't repoint XDG for the whole shared devshell. Sibling
# tools (htop, bat, ...) ignore this var. Mirrors the aws box's AWS_CONFIG_FILE.
WEZTERM_CONFIG_FILE = "/var/home/crussell/Code/cn/hosts/thinkpad/shellboxes/default/config/wezterm.lua"

[host]
tools = ["podman"]

# Extra display forwards for GUI apps (wezterm). shellbox already binds
# $XDG_RUNTIME_DIR (Wayland socket + session D-Bus at $XDG_RUNTIME_DIR/bus),
# /tmp/.X11-unix (X11), and /dev (DRI/GPU). The one remaining gap for a GPU
# terminal is:
#   /sys  — Mesa/Vulkan render-node enumeration
# Note: a [[binds]] guest must already exist in the (read-only) box rootfs, so
# its parent isn't a read-only layer. /sys exists in the Fedora image; /run/dbus
# does NOT (and /run is read-only), so the system bus socket can't be bound this
# way — but GUI apps use the session bus ($XDG_RUNTIME_DIR/bus), already bound.
[[binds]]
host = "/sys"
guest = "/sys"
mode = "ro"
optional = true
