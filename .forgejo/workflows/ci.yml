# PR gate for chad/cn — runs on the bees `nix-host` runner.
#
# Checks, fast-fail order:
#   1. treefmt --ci  (nixfmt-classic; same command as AGENTS.md)
#   2. nix flake check — the flake's checks BUILD every host toplevel
#      (flake.nix checks.<host> = config.system.build.toplevel), so this
#      is a real build gate, not just eval. bees's persistent /nix/store
#      makes it incremental.
#   3. thinkpad-image (path-gated, parallel): BUILD ONCE, PROMOTE ON MERGE.
#      On a PR: build the bootc Containerfile, run the shared
#      thinkpad-image-verify.sh gates, and push the VERIFIED image to zot
#      as cn/thinkpad-host:ctx-<build-context hash>. On the merge push:
#      retag that exact image to :stable + its version tag (seconds, no
#      rebuild), so `cjust image-upgrade` on think picks up a merge as
#      soon as this job is green. Falls back to the nightly build unit
#      when there's no fresh candidate. Logic + rationale live in
#      hosts/bees/thinkpad-image-ci.sh. Only runs when the image's build
#      inputs changed (see the changes job). Uses the nightly's dedicated
#      btrfs build store (warm layer cache; podman via sudo + wrapper path).
#
# Checkout is plain git over HTTPS with the job's GITHUB_TOKEN (works
# for any runner identity; repo is private). On pull_request,
# GITHUB_REF is the merge ref — we test exactly what merging would
# produce. Replaces the 2026-09-09 hostname-eval smoke workflow.
# (.forgejo/ is invisible to the GitHub mirror — only the Forgejo
# instance runs these.)
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Forgejo's act runner does not honor `on.paths:` filters, so path
# gating is done the portable way: a `changes` job diffs the event's
# commits against main and exports booleans; downstream jobs gate on
# them via needs + if.
jobs:
  changes:
    runs-on: nix-host
    timeout-minutes: 5
    outputs:
      thinkpad: ${{ steps.filter.outputs.thinkpad }}
    steps:
      - name: Checkout
        run: |
          set -eu
          git init -q .
          git remote add origin "https://${GITHUB_ACTOR:-x-access-token}:${{ secrets.GITHUB_TOKEN }}@git.crussell.io/chad/cn.git"
          git fetch --depth=1 origin main
          git fetch --depth=1 origin "+${GITHUB_REF}:"
          git checkout --detach FETCH_HEAD
      - name: Detect changed paths
        id: filter
        run: |
          set -eu
          BASE=origin/main
          # push-to-main events: compare against the previous commit.
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            BASE="${GITHUB_SHA}^"
            git fetch --depth=2 origin "+${GITHUB_REF}:"
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only "$BASE" )
          echo "changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE "^hosts/thinkpad/host-image/|^hosts/bees/thinkpad-image-(verify|ci)\.sh|^hosts/bees/thinkpad-registry\.nix|^hosts/bees/zot"; then
            echo "thinkpad=true" >> "$GITHUB_OUTPUT"
          else
            echo "thinkpad=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: nix-host
    timeout-minutes: 60
    steps:
      - name: Checkout
        run: |
          set -eu
          git init -q .
          git remote add origin "https://${GITHUB_ACTOR:-x-access-token}:${{ secrets.GITHUB_TOKEN }}@git.crussell.io/chad/cn.git"
          git fetch --depth 1 origin "+${GITHUB_REF}:"
          git checkout --detach FETCH_HEAD

      - name: Format check (treefmt)
        run: nix shell nixpkgs#treefmt nixpkgs#nixfmt-classic -c treefmt --ci

      - name: Flake check (builds all host toplevels)
        run: nix flake check

  thinkpad-image:
    needs: [changes]
    if: needs.changes.outputs.thinkpad == 'true'
    runs-on: nix-host
    timeout-minutes: 40
    steps:
      - name: Checkout
        run: |
          set -eu
          git init -q .
          git remote add origin "https://${GITHUB_ACTOR:-x-access-token}:${{ secrets.GITHUB_TOKEN }}@git.crussell.io/chad/cn.git"
          git fetch --depth 1 origin "+${GITHUB_REF}:"
          git checkout --detach FETCH_HEAD

      # Script holds the logic so it's shellcheck-able and runnable by hand:
      #   bash hosts/bees/thinkpad-image-ci.sh pr|promote
      - name: Build + verify + push candidate (PR)
        if: github.event_name == 'pull_request'
        run: bash hosts/bees/thinkpad-image-ci.sh pr

      - name: Promote verified candidate to :stable (merge)
        if: github.event_name == 'push'
        run: bash hosts/bees/thinkpad-image-ci.sh promote
