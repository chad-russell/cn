# shellbox pi — a self-contained pi coding agent (TUI)
#
# Config, state, auth, and sessions all live inside THIS directory, so pi is
# fully self-contained and never touches ~/.pi. $HOME is left alone, so ~,
# git config, ssh, and your prompt all behave normally — only pi's storage is
# redirected.
#
# pi exposes a single override, PI_CODING_AGENT_DIR, which it uses for
# everything (settings, extensions, skills, themes, prompts, trust, auth,
# sessions, and installed packages). We point it at ./config below. XDG_CACHE
# is redirected too so npm/node caches stay in the box.
#
# Because env values are now plain strings (no {manifest_dir} expansion), the
# paths below are absolute literals. They point at subdirectories of this very
# directory, which means THIS DIRECTORY must live at the path spelled out
# below. If you relocate it, update the paths to match.
#
# Recommended workflow (symlink, not copy):
#
#   1. Keep this directory somewhere stable and permanent, e.g. in a dotfiles
#      repo. The path must match the paths below.
#   2. Symlink it into shellbox's boxes dir so shellbox can find it:
#
#        shellbox link ~/Code/cn/atomic/thinkpad/shellboxes/pi
#        # or, from inside this directory: shellbox link
#
#   3. Build, mount, and export as usual:
#
#        shellbox build pi
#        sudo shellbox mount pi
#        shellbox export pi pi
#        # add ~/.local/share/shellbox/exports/bin to PATH once, then:
#        pi
#
# Why symlink instead of `create --from`? With a symlink, the box directory IS
# this directory, so pi reads its config from here and writes its runtime state
# (sessions, installed packages, auth) back here. A copy would split the
# vendored box from your real config, and `rm --purge`/`rename` would only
# ever touch the symlink — your pi state in this directory is never endangered.
#
# NOTE: config/ holds auth.json (API keys) and sessions. Both are gitignored
# here by default; see .gitignore.

name = "pi"

[shell]
tools = ["pi"]

[shell.env]
# Redirect all of pi's storage into subdirs of this box. Adjust the prefix if
# you relocate this directory. (The dirs are created on demand.)
PI_CODING_AGENT_DIR = "/var/home/crussell/Code/cn/atomic/thinkpad/shellboxes/pi/config"
XDG_CACHE_HOME      = "/var/home/crussell/Code/cn/atomic/thinkpad/shellboxes/pi/cache"
