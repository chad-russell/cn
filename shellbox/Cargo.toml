[package]
name = "shellbox"
version = "0.1.0"
edition = "2024"
description = "composefs-backed devshell utility"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
nix = { version = "0.30", features = ["user"] }
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
