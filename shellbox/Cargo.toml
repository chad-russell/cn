[package]
name = "shellbox"
version = "0.1.0"
edition = "2024"
description = "composefs-backed devshell utility"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
nix = { version = "0.30", features = ["user"] }
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"

# Rootless FUSE runtime. composefs provides the image parsing + repository;
# fuser provides the FUSE protocol types. We vendor the TreeFuse serve loop
# (with readdirplus) rather than depending on composefs-fuse, which lacks it.
# These pull in tokio transitively — a noticeable dependency hit, accepted in
# exchange for a fully rootless, daemonless mount path.
composefs = { git = "https://github.com/composefs/composefs-rs", default-features = false }
fuser = { version = "0.15", default-features = false, features = ["abi-7-31"] }
rustix = { version = "1.0", default-features = false, features = ["fs", "mount", "process", "thread", "std"] }

# Speed up heavy transitive deps in dev builds.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.zstd]
opt-level = 3
[profile.dev.package.tokio]
opt-level = 1
