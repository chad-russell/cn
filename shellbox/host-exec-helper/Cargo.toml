[package]
name = "shellbox-host-exec"
version = "0.1.0"
edition = "2024"
description = "shellbox in-box helper that bridges [host] tools to the host via a session socket"
license = "MIT OR Apache-2.0"

# Intentionally zero external dependencies: this binary runs inside arbitrary
# box root filesystems (Fedora/Ubuntu/Arch/...) and must link only libc. Build
# it statically for full cross-distro portability (see ../build.sh note):
#
#   cargo build --release --target x86_64-unknown-linux-musl
#
# A dynamic build also works when the host and box share a compatible glibc.
[dependencies]
